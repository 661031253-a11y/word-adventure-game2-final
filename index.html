<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Adventure Game 2</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Mali', sans-serif;
    background: linear-gradient(135deg, #dff4ff, #f8e8ff);
    min-height: 100vh;
    overflow-x: hidden;
}

.screen {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.screen.active {
    display: flex;
}

.card {
    width: min(900px, 94vw);
    background: rgba(255,255,255,0.94);
    border-radius: 30px;
    padding: 35px;
    box-shadow: 0 15px 40px rgba(50,70,120,0.20);
    text-align: center;
}

h1 {
    color: #1769aa;
    font-size: clamp(28px, 5vw, 48px);
    margin: 10px 0;
}

h2 {
    color: #286090;
}

.subtitle {
    color: #666;
    font-size: 20px;
    margin-bottom: 25px;
}

.character {
    width: 170px;
    height: 170px;
    object-fit: contain;
    margin: 10px;
}

input {
    width: min(550px, 90%);
    padding: 16px 20px;
    border: 3px solid #8ecae6;
    border-radius: 18px;
    font-family: 'Mali', sans-serif;
    font-size: 22px;
    text-align: center;
    outline: none;
}

input:focus {
    border-color: #2196f3;
}

button {
    border: none;
    border-radius: 18px;
    padding: 14px 28px;
    margin: 10px;
    font-family: 'Mali', sans-serif;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    background: #2196f3;
    color: white;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.15);
}

.start-btn {
    background: #42a5f5;
    font-size: 24px;
    padding: 16px 45px;
}

.back-btn {
    background: #78909c;
}

.font-box {
    margin: 25px auto;
    padding: 25px;
    background: #f5fbff;
    border-radius: 22px;
    max-width: 700px;
}

.font-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
}

.font-buttons button {
    background: #64b5f6;
    font-size: 17px;
}

.name-preview {
    margin: 25px auto;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    border-radius: 20px;
    background: white;
    border: 3px dashed #90caf9;
    color: #1565c0;
    font-size: 48px;
    word-break: break-word;
}

.game-area {
    width: min(1100px, 96vw);
    min-height: 90vh;
    background: rgba(255,255,255,0.95);
    border-radius: 30px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.18);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.player-name {
    color: #1565c0;
    font-size: 24px;
    font-weight: 700;
}

.task-box {
    margin: 25px auto;
    padding: 25px;
    max-width: 800px;
    background: #eef8ff;
    border-radius: 25px;
}

.task-box h2 {
    font-size: 28px;
}

.big-name {
    font-size: 55px;
    color: #1565c0;
    margin: 25px;
    word-break: break-word;
}

.tool-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
}

.tool-buttons button {
    min-width: 120px;
}

.bold-btn {
    font-weight: 900;
}

.italic-btn {
    font-style: italic;
}

.underline-btn {
    text-decoration: underline;
}

.success {
    background: #66bb6a;
}

.popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.popup.show {
    display: flex;
}

.popup-card {
    width: min(500px, 90vw);
    background: white;
    border-radius: 28px;
    padding: 35px;
    text-align: center;
}

.popup-card h2 {
    font-size: 32px;
}

@media(max-width:600px) {
    .card,
    .game-area {
        padding: 20px;
    }

    .name-preview,
    .big-name {
        font-size: 34px;
    }

    button {
        font-size: 17px;
        padding: 12px 20px;
    }
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<section id="screen1" class="screen active">
    <div class="card">

        <img src="images/เวอร์ดี้.png"
             class="character"
             alt="Wordy">

        <h1>Word Adventure</h1>

        <div class="subtitle">
            เกมที่ 2 : นักออกแบบตัวอักษร
        </div>

        <h2>ใส่ชื่อของนักผจญภัย</h2>

        <input
            id="nameInput"
            type="text"
            placeholder="พิมพ์ชื่อของหนูตรงนี้"
            maxlength="30"
        >

        <br><br>

        <button class="start-btn" onclick="startGame()">
            🚀 เริ่มการผจญภัย
        </button>

    </div>
</section>


<!-- SCREEN 2 -->
<section id="screen2" class="screen">
    <div class="card">

        <img src="images/เวอร์ดี้.png"
             class="character"
             alt="Wordy">

        <h1>🎨 นักออกแบบตัวอักษร</h1>

        <p class="subtitle">
            เลือกแบบตัวอักษรที่หนูชอบ
        </p>

        <div class="name-preview" id="namePreview">
            ชื่อของหนู
        </div>

        <div class="font-box">

            <h2>เลือกแบบอักษร</h2>

            <div class="font-buttons">

                <button onclick="changeFont('Mali')">
                    Mali
                </button>

                <button onclick="changeFont('Arial')">
                    Arial
                </button>

                <button onclick="changeFont('Georgia')">
                    Georgia
                </button>

                <button onclick="changeFont('Courier New')">
                    Courier
                </button>

                <button onclick="changeFont('Verdana')">
                    Verdana
                </button>

            </div>

        </div>

        <button class="start-btn" onclick="goToGame()">
            ✨ ไปต่อ
        </button>

        <button class="back-btn" onclick="showScreen('screen1')">
            ← กลับ
        </button>

    </div>
</section>


<!-- SCREEN 3 -->
<section id="screen3" class="screen">
    <div class="game-area">

        <div class="top-bar">

            <div class="player-name">
                👤 <span id="playerName"></span>
            </div>

            <div>
                ⭐ คะแนน: <span id="score">0</span>
            </div>

        </div>

        <div class="task-box">

            <img src="images/เวอร์ดี้.png"
                 class="character"
                 alt="Wordy">

            <h1>ภารกิจที่ 1</h1>

            <h2>
                ลองออกแบบชื่อของตัวเอง!
            </h2>

            <p class="subtitle">
                เลือกเครื่องมือเพื่อเปลี่ยนรูปแบบตัวอักษร
            </p>

            <div class="big-name" id="gameName">
                ชื่อของหนู
            </div>

            <div class="tool-buttons">

                <button
                    class="bold-btn"
                    onclick="applyTool('bold')">
                    B
                </button>

                <button
                    class="italic-btn"
                    onclick="applyTool('italic')">
                    I
                </button>

                <button
                    class="underline-btn"
                    onclick="applyTool('underline')">
                    U
                </button>

            </div>

            <br>

            <button
                class="success"
                onclick="finishGame()">
                ✅ เสร็จแล้ว
            </button>

        </div>

    </div>
</section>


<!-- POPUP -->
<div id="popup" class="popup">

    <div class="popup-card">

        <img
            src="images/เวอร์ดี้.png"
            class="character"
            alt="Wordy">

        <h2>🎉 เก่งมาก!</h2>

        <p id="popupText">
            หนูออกแบบตัวอักษรสำเร็จแล้ว
        </p>

        <button onclick="closePopup()">
            ไปต่อ
        </button>

    </div>

</div>


<script>

let playerName = "";
let selectedFont = "Mali";
let score = 0;

const nameInput = document.getElementById("nameInput");
const namePreview = document.getElementById("namePreview");
const gameName = document.getElementById("gameName");
const playerNameElement = document.getElementById("playerName");

nameInput.addEventListener("input", function() {

    const value = this.value.trim();

    namePreview.textContent =
        value || "ชื่อของหนู";

    namePreview.style.fontFamily =
        selectedFont;
});


function showScreen(id) {

    document.querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document.getElementById(id)
        .classList.add("active");
}


function startGame() {

    const value =
        nameInput.value.trim();

    if (!value) {

        alert("กรุณาใส่ชื่อก่อนนะคะ 💙");

        return;
    }

    playerName = value;

    namePreview.textContent =
        playerName;

    namePreview.style.fontFamily =
        selectedFont;

    showScreen("screen2");
}


function changeFont(font) {

    selectedFont = font;

    namePreview.style.fontFamily =
        selectedFont;

    if (gameName) {

        gameName.style.fontFamily =
            selectedFont;
    }
}


function goToGame() {

    playerNameElement.textContent =
        playerName;

    gameName.textContent =
        playerName;

    gameName.style.fontFamily =
        selectedFont;

    showScreen("screen3");
}


function applyTool(tool) {

    if (tool === "bold") {

        gameName.style.fontWeight =
            gameName.style.fontWeight === "900"
            ? "400"
            : "900";

        score += 10;
    }

    if (tool === "italic") {

        gameName.style.fontStyle =
            gameName.style.fontStyle === "italic"
            ? "normal"
            : "italic";

        score += 10;
    }

    if (tool === "underline") {

        gameName.style.textDecoration =
            gameName.style.textDecoration === "underline"
            ? "none"
            : "underline";

        score += 10;
    }

    document.getElementById("score")
        .textContent = score;
}


function finishGame() {

    document.getElementById("popupText")
        .textContent =
        "เยี่ยมมาก " +
        playerName +
        "! หนูสามารถออกแบบตัวอักษรของตัวเองได้แล้ว 🎨";

    document.getElementById("popup")
        .classList.add("show");
}


function closePopup() {

    document.getElementById("popup")
        .classList.remove("show");
}

</script>

</body>
</html>
